<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Go Gumi — Redirigiendo...</title>
    <script type="text/javascript">
      // SPA redirect script para GitHub Pages:
      // Redirige URLs directas como /go_gumi/preventa-primeros-pasos hacia index.html
      var pathSegmentsToKeep = 1; // 1 porque el repositorio en GitHub Pages tiene la ruta /go_gumi/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #5B21B6;">
      Cargando Go Gumi...
    </p>
  </body>
</html>
